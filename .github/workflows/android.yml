name: Android-widget bouwen

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: APK bouwen
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: het-kasteeltje-widget
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Release met download-link bijwerken
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk het-kasteeltje-widget.apk
          gh release delete widget-latest --cleanup-tag --yes || true
          gh release create widget-latest het-kasteeltje-widget.apk \
            --title "Android-widget" \
            --notes "Download het-kasteeltje-widget.apk op je telefoon en installeer het." \
            --target "$GITHUB_SHA"
